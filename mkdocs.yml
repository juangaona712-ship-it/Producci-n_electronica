site_name: MonoFab
site_url: https://juangaona712-ship-it.github.io/Producci-n_electronica/
site_description: Documentación de proyectos de la materia de producción electronica.

theme:
  name: material
  language: es
  font:
    text: Roboto
    code: JetBrains Mono
  palette:
    # Modo oscuro (Mantiene el rojo y es el modo por defecto)
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
        
    # Modo claro 
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

  features:
    - navigation.tabs          # Pestañas horizontales superiores
    - navigation.sections      # Secciones agrupadas en el menú lateral
    - navigation.expand        # Menús desplegados por defecto
    - navigation.top           # Botón flotante para regresar arriba
    - navigation.instant       # Carga páginas al instante sin recarga completa
    - content.code.copy        # Botón de copiar código
    - content.tooltips         # Tooltips informativos
    - toc.follow               # El índice sigue el scroll

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.critic:
      mode: view
  - pymdownx.caret
  - pymdownx.keys
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css
nav:
  - Inicio: index.md
  - 📖 Documentación Técnica:
      - Resumen del Proyecto: resumen.md
      - Esquemático: esquematico.md
      - Diseño de PCB: pcb.md
      - Pruebas y Ensamble: pruebas.md
